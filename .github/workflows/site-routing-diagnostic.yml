name: Diagnose public site routing
on:
  push:
    paths:
      - '.github/workflows/site-routing-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare live domain and repository content
        shell: bash
        run: |
          echo '=== DNS A ==='
          dig +short A dougu-hikaku.com || true
          echo '=== DNS AAAA ==='
          dig +short AAAA dougu-hikaku.com || true
          echo '=== DNS NS ==='
          dig +short NS dougu-hikaku.com || true
          echo '=== GITHUB EXPECTED A ==='
          echo '185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153'
          echo '=== LIVE PAGE RESPONSE ==='
          curl -sSL --max-time 20 -D /tmp/site.headers -o /tmp/site.html -w 'HTTP_CODE=%{http_code} REMOTE_IP=%{remote_ip} FINAL_URL=%{url_effective}\n' https://dougu-hikaku.com/ankle-weight-comparison.html || true
          head -25 /tmp/site.headers || true
          echo '=== LIVE CONTENT FLAGS ==='
          if [ -f /tmp/site.html ]; then
            if grep -q '差し込み予定' /tmp/site.html; then echo 'OLD_PLACEHOLDER=YES'; else echo 'OLD_PLACEHOLDER=NO'; fi
            if grep -q '公開前ドラフト' /tmp/site.html; then echo 'OLD_DRAFT_FOOTER=YES'; else echo 'OLD_DRAFT_FOOTER=NO'; fi
            wc -c /tmp/site.html
          fi
          echo '=== REPOSITORY CONTENT FLAGS ==='
          curl -sSL --max-time 20 -o /tmp/repo.html https://raw.githubusercontent.com/TIKE2026/my-wash-bay/main/ankle-weight-comparison.html || true
          if [ -f /tmp/repo.html ]; then
            if grep -q '差し込み予定' /tmp/repo.html; then echo 'REPO_PLACEHOLDER=YES'; else echo 'REPO_PLACEHOLDER=NO'; fi
            wc -c /tmp/repo.html
          fi
