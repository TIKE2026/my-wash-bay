# main に push されたら、サイトのファイルをエックスサーバーへアップロードする。
# 必要な Secret: XSERVER_SSH_KEY(秘密鍵の中身。GitHub の Settings → Secrets and variables → Actions で登録)
name: エックスサーバーへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # アフィリエイトリンクの見張り: 前回の push から、リンクが消えたり一字でも変わったりしていたら公開しない。
      # ユーザーが了承したリンクの差し替え・削除のときだけ、コミットメッセージに [affiliate-ok] を入れる。
      - name: アフィリエイトリンクの点検
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          if git log --format=%B "$BASE..HEAD" | grep -q '\[affiliate-ok\]'; then export AFFILIATE_OK=1; fi
          python3 .github/scripts/affiliate_guard.py --range "$BASE" HEAD

      - name: SSH の準備
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo '[sv17340.xserver.jp]:10022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuK6cXIfY5nPG4pB0kS1O3qo7pvpXfT7z76ZpgqfsBp' > ~/.ssh/known_hosts

      - name: アップロード(rsync)
        run: |
          rsync -rlptcv --delete \
            --exclude '.git/' --exclude '.github/' \
            --exclude '_work/' --exclude 'CLAUDE.md' --exclude '.claude/' \
            --exclude '.htaccess' --exclude '.user.ini' --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/id_deploy -p 10022 -o BatchMode=yes" \
            ./ xs647918@sv17340.xserver.jp:dougu-hikaku.com/public_html/
